# ---- Network ----
port 6379
bind 0.0.0.0
protected-mode no

# ---- FLASH Storage (RocksDB) ----
storage-provider flash /data/flash

# ---- Persistence ----
save ""
appendonly no

# ---- Replication (Replica) ----
replica-read-only yes

# ---- Logging ----
loglevel notice
logfile ""

# Enable active replication (KeyDB feature)
active-replica yes
