services:
  # ==================== KeyDB Master ====================
  keydb-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: keydb-flash:latest
    container_name: keydb-master
    network_mode: host
    volumes:
      - ./conf/keydb-master.conf:/etc/keydb/keydb.conf:ro
      - keydb_master_data:/data
    command: >
      /etc/keydb/keydb.conf
      --port 6379
    healthcheck:
      test: ["CMD", "keydb-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==================== KeyDB Replica 1 ====================
  keydb-replica-1:
    image: keydb-flash:latest
    container_name: keydb-replica-1
    network_mode: host
    volumes:
      - ./conf/keydb-replica.conf:/etc/keydb/keydb.conf:ro
      - keydb_replica1_data:/data
    command: >
      /etc/keydb/keydb.conf
      --port 6380
      --replicaof 127.0.0.1 6379
    depends_on:
      keydb-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "keydb-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==================== KeyDB Replica 2 ====================
  keydb-replica-2:
    image: keydb-flash:latest
    container_name: keydb-replica-2
    network_mode: host
    volumes:
      - ./conf/keydb-replica.conf:/etc/keydb/keydb.conf:ro
      - keydb_replica2_data:/data
    command: >
      /etc/keydb/keydb.conf
      --port 6381
      --replicaof 127.0.0.1 6379
    depends_on:
      keydb-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "keydb-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  keydb_master_data:
  keydb_replica1_data:
  keydb_replica2_data:
